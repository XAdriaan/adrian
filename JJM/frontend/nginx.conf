server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker actualiza la IP al recrear el backend. El alias pertenece únicamente
    # a la red privada de este Compose, no a la red compartida de Coolify.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Keep API requests out of the static HTML/JS/CSS locations.
    location ^~ /api/ {
        set $api_backend projectsphere-api:8080;
        proxy_pass http://$api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Las páginas HTML nunca se cachean durante esta etapa de despliegue.
    # Así el navegador recibe inmediatamente la versión nueva de login/menu.
    location ~* \.html$ {
        try_files $uri =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
}
