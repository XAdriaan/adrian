server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # La API sigue siendo del mismo dominio para el navegador.
    # Nginx la reenvía internamente al contenedor Spring Boot.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Archivos reales del frontend.
    # Si una ruta no existe, vuelve al index en vez de enviar al Whitelabel de Spring.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
