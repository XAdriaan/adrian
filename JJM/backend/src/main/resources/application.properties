spring.application.name=oficina-proyectos-backend

# Variables opcionales para producción:
# SERVER_PORT, DB_URL, DB_USER, DB_PASSWORD
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/oficina_proyectos?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Mexico_City}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.sql.init.mode=never

server.error.include-message=always
server.error.include-binding-errors=always

# Permite documentos PDF pequeños almacenados temporalmente como base64 en BD.
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=6MB

# =========================================================
# CORREO GMAIL
# La cuenta y la contraseña de aplicación NO se guardan en el proyecto.
# Ejecuta iniciar-backend.bat e introdúcelas al arrancar.
# Requiere verificación en dos pasos + contraseña de aplicación de Google.
# =========================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000