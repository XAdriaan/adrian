services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      PMO_TURN_URLS: ${PMO_TURN_URLS:-}
      PMO_TURN_USERNAME: ${PMO_TURN_USERNAME:-}
      PMO_TURN_CREDENTIAL: ${PMO_TURN_CREDENTIAL:-}
      PMO_RECORDINGS_DIR: /app/grabaciones
      TZ: America/Mexico_City
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75.0 -Dfile.encoding=UTF-8}
    expose:
      - "8080"
    volumes:
      - pmo_recordings:/app/grabaciones
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/api/salud"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s
    networks:
      default:
      pmo_api:
        aliases:
          - projectsphere-api

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/api/salud"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      default:
      pmo_api:
        aliases:
          - projectsphere-web

networks:
  default:
  pmo_api:
    internal: true

volumes:
  pmo_recordings:
