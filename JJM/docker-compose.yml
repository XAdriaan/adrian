services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      PMO_AJUSTE_PERSONAL_OCT30: "true"
      PMO_IA_LOCAL_URL: http://ollama:11434
      PMO_IA_LOCAL_MODELO: qwen2.5:7b
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      PMO_TURN_URLS: ${PMO_TURN_URLS:-}
      PMO_TURN_USERNAME: ${PMO_TURN_USERNAME:-}
      PMO_TURN_CREDENTIAL: ${PMO_TURN_CREDENTIAL:-}
      PMO_OPENAI_API_KEY: ${PMO_OPENAI_API_KEY:-}
      PMO_VOICE_MODEL: ${PMO_VOICE_MODEL:-gpt-audio-1.5}
      PMO_TRANSCRIBE_MODEL: ${PMO_TRANSCRIBE_MODEL:-gpt-transcribe}
      PMO_VOICE_NAME: ${PMO_VOICE_NAME:-alloy}
      PMO_VOICE_DAILY_LIMIT: ${PMO_VOICE_DAILY_LIMIT:-60}
      PMO_RECORDINGS_DIR: /app/grabaciones
      TZ: America/Mexico_City
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75.0 -Dfile.encoding=UTF-8}
    expose:
      - "8080"
    volumes:
      - pmo_recordings:/app/grabaciones
      - /srv/jjm-respaldos:/app/respaldos:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/api/salud"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s
    networks:
      default:
      pmo_api:
        aliases:
          - projectsphere-api

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/api/salud"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      default:
      pmo_api:
        aliases:
          - projectsphere-web

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    cpus: 6
    mem_limit: 12g
    environment:
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_MAX_QUEUE: 2
      OLLAMA_CONTEXT_LENGTH: 4096
      OLLAMA_KEEP_ALIVE: 2m
    volumes:
      pmo_ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      default:
      pmo_api:
        aliases:
          - ollama

  ollama-modelo:
    image: ollama/ollama:latest
    restart: "on-failure:3"
    cpus: 1
    mem_limit: 256m
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "qwen2.5:7b"]
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - pmo_api

networks:
  default:
  pmo_api:
    internal: true

volumes:
  pmo_recordings:
  pmo_ollama:
